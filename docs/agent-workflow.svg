<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1080" viewBox="0 0 900 1080" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.5; }
      .title { font-size: 20px; font-weight: 600; fill: #1f2328; text-anchor: middle; }
      .sub { font-size: 14px; fill: #57606a; text-anchor: middle; }
      .code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 15px; fill: #0969da; }
      .guard { font-size: 14px; fill: #8a4b08; text-anchor: middle; }
      .badge { font-size: 13px; font-weight: 600; text-anchor: middle; }
      .flow { stroke: #57606a; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="900" height="1080" rx="18" fill="#f6f8fa"/>

  <!-- Employee chat -->
  <rect x="30" y="30" width="840" height="80" rx="12" fill="#eef2fb" stroke="#c9d6f2" stroke-width="1.5"/>
  <text x="450" y="63" class="title">Frontend chat  <tspan font-size="15px" font-weight="400" fill="#57606a">(Next.js)</tspan></text>
  <text x="450" y="90" class="sub">Employee describes an IT issue in plain language · IT team follows it on the dashboard</text>
  <path d="M450,110 V138" class="flow"/>

  <!-- Input guardrail -->
  <rect x="30" y="142" width="840" height="54" rx="12" fill="#fff8f0" stroke="#f0d0a8" stroke-width="1.5"/>
  <text x="450" y="175" class="guard"><tspan font-weight="600">Input guardrail</tspan> · block shared passwords and prompt injection · redact personal data</text>
  <path d="M450,196 V224" class="flow"/>

  <!-- 1. Triage -->
  <rect x="30" y="228" width="840" height="80" rx="12" class="box"/>
  <text x="450" y="261" class="title">1. Triage  <tspan class="code">classify_issue</tspan></text>
  <text x="450" y="288" class="sub">LLM understands the issue · category · priority · team · airport</text>
  <path d="M450,308 V336" class="flow"/>

  <!-- 2. Knowledge retrieval -->
  <rect x="30" y="340" width="840" height="80" rx="12" class="box"/>
  <text x="450" y="373" class="title">2. Knowledge retrieval (RAG)  <tspan class="code">search_knowledge</tspan></text>
  <text x="450" y="400" class="sub">SOPs and IT policy from Pinecone · vector search → rerank · always before any MongoDB tool</text>
  <path d="M450,420 V448" class="flow"/>

  <!-- 3. Decision agent -->
  <rect x="30" y="452" width="840" height="100" rx="12" class="box"/>
  <text x="450" y="485" class="title">3. Decision agent  <tspan class="code">resolve_issue ⇄ tools</tspan></text>
  <text x="450" y="512" class="sub">Recommends a fix · asks follow-up questions · chooses one tool at a time</text>
  <text x="450" y="535" class="sub">Tools read and write MongoDB: employee profile · similar tickets · tickets · approvals</text>
  <path d="M164,552 V584" class="flow"/>
  <path d="M450,552 V584" class="flow"/>
  <path d="M736,552 V584" class="flow"/>

  <!-- Paths -->
  <rect x="30" y="588" width="268" height="132" rx="12" class="box"/>
  <rect x="119" y="604" width="90" height="26" rx="13" fill="#e6f4ea"/>
  <text x="164" y="622" class="badge" fill="#1a7f37">Path A</text>
  <text x="164" y="662" class="title">Self-service</text>
  <text x="164" y="688" class="sub">SOP steps for the employee,</text>
  <text x="164" y="708" class="sub">then verify it is fixed</text>

  <rect x="316" y="588" width="268" height="132" rx="12" class="box"/>
  <rect x="405" y="604" width="90" height="26" rx="13" fill="#fff1e5"/>
  <text x="450" y="622" class="badge" fill="#bc4c00">Path B</text>
  <text x="450" y="662" class="title">Ticket / incident</text>
  <text x="450" y="688" class="sub">Create, prioritise, route L1 / L2</text>
  <text x="450" y="708" class="sub">2+ reports at an airport → one P1</text>

  <rect x="602" y="588" width="268" height="132" rx="12" class="box"/>
  <rect x="691" y="604" width="90" height="26" rx="13" fill="#f3eefc"/>
  <text x="736" y="622" class="badge" fill="#6f42c1">Path C</text>
  <text x="736" y="662" class="title">Access request</text>
  <text x="736" y="688" class="sub">Ticket + approval request,</text>
  <text x="736" y="708" class="sub">the agent pauses (interrupt)</text>

  <path d="M164,720 V752" class="flow"/>
  <path d="M450,720 V752" class="flow"/>
  <path d="M736,720 V752" class="flow"/>

  <!-- 4. Human-in-the-loop -->
  <rect x="30" y="756" width="840" height="80" rx="12" class="box"/>
  <text x="450" y="789" class="title">4. Human-in-the-loop (when needed)</text>
  <text x="450" y="816" class="sub">Manager or IAM approves / rejects → the agent resumes · engineers work escalated tickets</text>
  <path d="M450,836 V864" class="flow"/>

  <!-- Output guardrail -->
  <rect x="30" y="868" width="840" height="54" rx="12" fill="#fff8f0" stroke="#f0d0a8" stroke-width="1.5"/>
  <text x="450" y="901" class="guard"><tspan font-weight="600">Output guardrail</tspan> · remove [IT only] steps · never ask for passwords · redact personal data</text>
  <path d="M450,922 V950" class="flow"/>

  <!-- 5. Final response -->
  <rect x="30" y="954" width="840" height="100" rx="12" fill="#eaf5ee" stroke="#b7dfc3" stroke-width="1.5"/>
  <text x="450" y="987" class="title">5. Final response and ticket update</text>
  <text x="450" y="1014" class="sub">Reply streamed to the chat step by step · ticket, comments and audit trail saved in MongoDB</text>
  <text x="450" y="1037" class="sub">Chat memory checkpointed, so follow-up messages continue from here</text>
</svg>
